apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1
    updateStrategy:
      type: Recreate
    nodeSelector:
      kubernetes.io/hostname: vm-12-8-ubuntu
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role
        operator: Equal
        value: control-plane
        effect: NoSchedule
    persistence:
      enabled: true
      existingClaim: traefik-cloud
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 128Mi
      path: /data
    podSecurityContext:
      fsGroup: 65532
    certificatesResolvers:
      zeropress:
        acme:
          email: REPLACE_WITH_CONTACT_EMAIL
          caServer: https://acme-v02.api.letsencrypt.org/directory
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
